name: Deploy to Production

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  deploy-production:
    name: Deploy production
    environment: production
    runs-on: am-github-runner
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & tag docker image
        uses: AplinkosMinisterija/reusable-workflows/.github/actions/docker-build-tag-push@main
        with:
          environment: production
          push: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push watchdog image
        uses: docker/build-push-action@v5
        with:
          context: ./watchdog
          push: true
          platforms: linux/amd64
          tags: ghcr.io/smalsuolis/smalsuolis-watchdog:production
          cache-from: type=gha,scope=watchdog
          cache-to: type=gha,mode=max,scope=watchdog

      - name: Trigger deploy
        uses: AplinkosMinisterija/reusable-workflows/.github/actions/trigger-workflow-and-wait@main
        with:
          application-id: ${{ secrets.SMALSUOLIS_TRIGGER_DEPLOY_APPLICATION_ID }}
          application-private-key: ${{ secrets.SMALSUOLIS_TRIGGER_DEPLOY_APPLICATION_PRIVATE_KEY }}
          repository: ${{ secrets.SMALSUOLIS_TRIGGER_DEPLOY_REPOSITORY }}
          workflow-file-name: ${{ secrets.SMALSUOLIS_TRIGGER_DEPLOY_WORKFLOW_FILE_NAME }}
          workflow-payload: '{"environment": "production"}'
