version: '3.3'

services:
  postgres:
    image: postgis/postgis:14-master
    networks:
      - internal
    ports:
      - 5112:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smalsuolis
      TZ: 'Etc/GMT'
      PGTZ: 'Etc/GMT'
    volumes:
      - ./01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql
    healthcheck:
      test: ['CMD', 'pg_isready']

  auth-api:
    image: ghcr.io/aplinkosministerija/biip-auth-api:1.2.9
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - internal
    ports:
      - 4444:3000
    environment:
      PORT: 3000
      NAMESPACE:
      SERVICEDIR: dist/services
      DB_CONNECTION: postgresql://postgres:postgres@postgres:5432/auth
      REDIS_CONNECTION: redis://redis
      JWT_SECRET: very-much-secret
      DEFAULT_SUPER_ADMIN_EMAIL: superadmin@smalsuolis.lt
      DEFAULT_SUPER_ADMIN_PASSWORD: LabaiSlaptas123!
      DEFAULT_PROJECT_NAME_GENITIVE: Smalsuolio
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ping || exit 1']
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5

  chrome:
    image: browserless/chrome:latest
    restart: unless-stopped
    platform: linux/amd64
    environment:
      DEFAULT_LAUNCH_ARGS: '["--window-size=1920,1080"]'
      WORKSPACE_DELETE_EXPIRED: true
      MAX_CONCURRENT_SESSIONS: 10
      MAX_QUEUE_LENGTH: 10
      CONNECTION_TIMEOUT: 3600000
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://127.0.0.1:3000/metrics || exit 1']
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    ports:
      - 9321:3000

  redis:
    image: redis:latest
    networks:
      - internal
    ports:
      - 6112:6379
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  internal:

volumes:
  data:
